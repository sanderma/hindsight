# Hindsight OpenCode — recall quality evaluation
#
# Compares two recall strategies on identical memories:
#   session-start: generic recall at session start (old behavior)
#   per-turn:      recall every turn using the actual question (new behavior)
#
# Both providers query the SAME pre-populated bank (same extracted memories).
# Only the recall strategy differs — true apples-to-apples comparison.
#
# Setup (retain memories once, generates generated-tests.json):
#   npx tsx tests/promptfoo/setup.ts
#
# Run eval:
#   cd tests/promptfoo && npx promptfoo@latest eval
#
# Or combined (from the opencode dir):
#   npm run eval
#
# Requires:
#   HINDSIGHT_API_URL   running Hindsight server
#   LLM_BASE_URL        OpenAI-compatible endpoint (or vLLM)
#   LLM_API_KEY         API key
#   LLM_MODEL           model name (default: gpt-4o-mini)

description: "Hindsight OpenCode recall quality — session-start vs per-turn"

providers:
  - id: "file://provider.ts"
    label: "session-start (old)"
    config:
      recallMode: session-start

  - id: "file://provider.ts"
    label: "per-turn (new)"
    config:
      recallMode: per-turn

prompts:
  - "{{question}}"

# Test cases are generated by setup.ts (which retains histories and adds bankIds).
# Run setup.ts before eval — see instructions above.
tests: file://generated-tests.json
